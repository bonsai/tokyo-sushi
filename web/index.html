<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokyo Sushi × Date Optimization</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;background:#fafafa;color:#222}h1{margin-bottom:4px}.sub{color:#666}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px}.score{font-size:2rem;font-weight:700}.bar{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:#222}.meta{color:#666}.weights{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tag{padding:6px 10px;border:1px solid #ddd;border-radius:999px;background:white;font-size:.85rem}
</style>
</head>
<body>
<h1>Tokyo Sushi × Date Optimization</h1>
<p class="sub">予算4,000円前後で、デート体験を最大化するPOC</p>
<div id="weights" class="weights"></div>
<div id="app" class="grid"></div>
<script>
const dims=['price','visual','conversation','atmosphere','surprise','access','food'];
fetch('./data/sushi.json').then(r=>r.json()).then(data=>{
 const weighted=s=>dims.reduce((a,k)=>a+s.scores[k]*data.weights[k],0);
 data.stores.forEach(s=>s.weighted_score=weighted(s));
 data.stores.sort((a,b)=>b.weighted_score-a.weighted_score);
 document.querySelector('#weights').innerHTML=Object.entries(data.weights).map(([k,v])=>`<span class="tag">${k}: ${Math.round(v*100)}%</span>`).join('');
 document.querySelector('#app').innerHTML=data.stores.map((s,i)=>`<article class="card"><h2>#${i+1} ${s.name}</h2><p class="meta">${s.area} · ¥${s.price.toLocaleString()}</p><div class="score">${(s.weighted_score*100).toFixed(1)}<small>/100</small></div>${dims.map(k=>`<div>${k} ${Math.round(s.scores[k]*100)}</div><div class="bar"><i style="width:${s.scores[k]*100}%"></i></div>`).join('')}</article>`).join('');
}).catch(e=>document.querySelector('#app').textContent='データ読み込みエラー: '+e.message);
</script>
</body>
</html>
